<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A111E"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg3)"/>
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <circle cx="200" cy="400" r="150" fill="#3B82F6" opacity="0.1" filter="url(#glow3)"/>
  <circle cx="650" cy="120" r="140" fill="#10B981" opacity="0.08" filter="url(#glow3)"/>

  <!-- Left Sidebar (Snippet categories) -->
  <rect x="30" y="30" width="180" height="440" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
  <text x="46" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SNIPPET VAULT</text>
  
  <rect x="42" y="80" width="156" height="32" rx="6" fill="rgba(59,130,246,0.15)"/>
  <text x="54" y="101" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ React Hooks (8)</text>

  <rect x="42" y="122" width="156" height="32" rx="6" fill="transparent"/>
  <text x="54" y="143" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">🛡️ TypeScript Utils (12)</text>

  <rect x="42" y="164" width="156" height="32" rx="6" fill="transparent"/>
  <text x="54" y="185" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">🐍 Python Scripts (6)</text>

  <rect x="42" y="206" width="156" height="32" rx="6" fill="transparent"/>
  <text x="54" y="227" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">🎨 CSS Grids (5)</text>

  <!-- Right Code View -->
  <rect x="230" y="30" width="540" height="440" rx="12" fill="rgba(10,14,24,0.95)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="230" y="30" width="540" height="44" rx="12" fill="rgba(255,255,255,0.03)"/>
  <circle cx="255" cy="52" r="5" fill="#EF4444"/>
  <circle cx="271" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="287" cy="52" r="5" fill="#10B981"/>
  <text x="315" y="56" fill="#CBD5E1" font-family="monospace" font-size="12">useDebounce.ts</text>
  <rect x="680" y="40" width="70" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="696" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Copy</text>

  <!-- Code lines -->
  <text x="250" y="110" fill="#64748B" font-family="monospace" font-size="12">01</text>
  <text x="280" y="110" fill="#F43F5E" font-family="monospace" font-size="12">import</text>
  <text x="330" y="110" fill="#E2E8F0" font-family="monospace" font-size="12">{ useState, useEffect } </text>
  <text x="500" y="110" fill="#F43F5E" font-family="monospace" font-size="12">from</text>
  <text x="540" y="110" fill="#10B981" font-family="monospace" font-size="12">'react';</text>

  <text x="250" y="140" fill="#64748B" font-family="monospace" font-size="12">02</text>

  <text x="250" y="170" fill="#64748B" font-family="monospace" font-size="12">03</text>
  <text x="280" y="170" fill="#3B82F6" font-family="monospace" font-size="12">export function</text>
  <text x="400" y="170" fill="#FBBF24" font-family="monospace" font-size="12">useDebounce&lt;T&gt;</text>
  <text x="510" y="170" fill="#E2E8F0" font-family="monospace" font-size="12">(value: T, delay: number): T {</text>

  <text x="250" y="200" fill="#64748B" font-family="monospace" font-size="12">04</text>
  <text x="300" y="200" fill="#818CF8" font-family="monospace" font-size="12">  const [debounced, setDebounced] = useState&lt;T&gt;(value);</text>

  <text x="250" y="230" fill="#64748B" font-family="monospace" font-size="12">05</text>
  <text x="300" y="230" fill="#38BDF8" font-family="monospace" font-size="12">  useEffect(() =&gt; {</text>

  <text x="250" y="260" fill="#64748B" font-family="monospace" font-size="12">06</text>
  <text x="320" y="260" fill="#E2E8F0" font-family="monospace" font-size="12">    const timer = setTimeout(() =&gt; setDebounced(value), delay);</text>

  <text x="250" y="290" fill="#64748B" font-family="monospace" font-size="12">07</text>
  <text x="320" y="290" fill="#F43F5E" font-family="monospace" font-size="12">    return () =&gt; clearTimeout(timer);</text>

  <text x="250" y="320" fill="#64748B" font-family="monospace" font-size="12">08</text>
  <text x="300" y="320" fill="#38BDF8" font-family="monospace" font-size="12">  }, [value, delay]);</text>

  <text x="250" y="350" fill="#64748B" font-family="monospace" font-size="12">09</text>

  <text x="250" y="380" fill="#64748B" font-family="monospace" font-size="12">10</text>
  <text x="300" y="380" fill="#F43F5E" font-family="monospace" font-size="12">  return debounced;</text>

  <text x="250" y="410" fill="#64748B" font-family="monospace" font-size="12">11</text>
  <text x="280" y="410" fill="#E2E8F0" font-family="monospace" font-size="12">}</text>
</svg>
